name: Terraform Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          cache: true

      - name: Initialize TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          config_file: .checkov.yml

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          trivy-config: trivy.yaml

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Actionlint
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.7.12"
          ASSET="actionlint_${VERSION}_linux_amd64.tar.gz"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ASSET}" \
            --output "${ASSET}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_checksums.txt" \
            --output actionlint_checksums.txt

          grep " ${ASSET}$" actionlint_checksums.txt | sha256sum --check --status

          tar -xzf "${ASSET}" actionlint

          ./actionlint \
            -color \
            -oneline
