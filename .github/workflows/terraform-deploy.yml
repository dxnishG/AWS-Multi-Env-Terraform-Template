name: Terraform Deploy

on:
  workflow_call:
    inputs:
      environments:
        required: true
        type: string

    secrets:
      TF_TOKEN:
        required: true

env:
  TF_VERSION: "1.9.0"

jobs:
  deploy:
    name: Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ${{ fromJSON(inputs.environments) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
          terraform_wrapper: false

      - name: Deploy environment
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Deploying $ENVIRONMENT"
          echo "=========================================="

          cp "envs/${ENVIRONMENT}/${ENVIRONMENT}.tfvars" terraform.auto.tfvars

          terraform init \
            -reconfigure \
            -backend-config="envs/${ENVIRONMENT}/${ENVIRONMENT}.tfconfig"

          terraform apply \
            -auto-approve
