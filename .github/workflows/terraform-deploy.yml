name: Terraform Deploy
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      TF_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment protections
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in dev|acc|prd) ;; *) exit 1 ;; esac
          if [ "$ENVIRONMENT" = prd ]; then
            gh api "repos/$GITHUB_REPOSITORY/environments/prd" > "$RUNNER_TEMP/prd-environment.json"
            jq -e '.protection_rules | any(.type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))' "$RUNNER_TEMP/prd-environment.json"
            jq -e '.deployment_branch_policy != null' "$RUNNER_TEMP/prd-environment.json"
          fi
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
          cli_config_credentials_hostname: ${{ vars.TF_HOSTNAME || 'app.terraform.io' }}
          terraform_wrapper: false
      - name: Run remote plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cp "envs/$ENVIRONMENT/$ENVIRONMENT.tfvars" terraform.auto.tfvars
          rm -rf .terraform
          terraform init -input=false -backend-config="envs/$ENVIRONMENT/$ENVIRONMENT.tfconfig"
          terraform plan -input=false -lock-timeout=5m
  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
          cli_config_credentials_hostname: ${{ vars.TF_HOSTNAME || 'app.terraform.io' }}
          terraform_wrapper: false
      - name: Apply remote plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cp "envs/$ENVIRONMENT/$ENVIRONMENT.tfvars" terraform.auto.tfvars
          rm -rf .terraform
          terraform init -input=false -backend-config="envs/$ENVIRONMENT/$ENVIRONMENT.tfconfig"
          terraform apply -input=false -auto-approve
          terraform output -json > "$RUNNER_TEMP/terraform-outputs.json"
          echo "AWS_REGION=$(jq -r '.aws_region.value' "$RUNNER_TEMP/terraform-outputs.json")" >> "$GITHUB_ENV"
      - name: Explain skipped rollout verification
        if: ${{ vars.APPLICATION_URL == '' || vars.AWS_VERIFY_ROLE_ARN == '' }}
        run: |
          echo "Infrastructure apply completed. Rollout verification was skipped."
          echo "Configure APPLICATION_URL and AWS_VERIFY_ROLE_ARN in the GitHub Environment to enable it."
      - name: Assume read-only rollout verification role
        if: ${{ vars.APPLICATION_URL != '' && vars.AWS_VERIFY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_VERIFY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify rollout and application readiness
        if: ${{ vars.APPLICATION_URL != '' && vars.AWS_VERIFY_ROLE_ARN != '' }}
        env:
          APPLICATION_URL: ${{ vars.APPLICATION_URL }}
        run: python3 .github/scripts/verify_rollout.py "$RUNNER_TEMP/terraform-outputs.json"
