name: Terraform CI/CD

on:
  push:
    paths:
      - "**/*.tf"
      - "envs/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "**/*.tf"
      - "envs/**"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      run_apply:
        description: Execute Terraform apply
        type: boolean
        default: false

env:
  TF_VERSION: "1.9.0"

  # To skip an environment just comment it out from ENVIRONMENTS.
  ENVIRONMENTS: |
    dev
    acc
    prd

concurrency:
  group: terraform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  environments:
    name: Build environment matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix="$(
            printf '%s\n' "$ENVIRONMENTS" |
              sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' |
              jq -Rsc '
                split("\n")
                | map(select(length > 0))
              '
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Environments: $matrix"

  plan:
    name: Plan (${{ matrix.environment }})
    needs: environments
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.matrix) }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="envs/${{ matrix.environment }}/${{ matrix.environment }}.tfconfig"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          cp "envs/${{ matrix.environment }}/${{ matrix.environment }}.tfvars" terraform.auto.tfvars
          terraform plan

  deploy:
    name: Deploy
    needs:
      - environments
      - plan

    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_apply)

    uses: ./.github/workflows/terraform-deploy.yml
    secrets: inherit

    with:
      environments: ${{ needs.environments.outputs.matrix }}
