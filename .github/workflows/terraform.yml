name: Terraform CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
# Serialize promotions across every ref; never cancel an active apply.
concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/terraform-quality.yml

  plan:
    name: Terraform Plan (${{ matrix.environment }})
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, acc, prd]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
          cli_config_credentials_hostname: ${{ vars.TF_HOSTNAME || 'app.terraform.io' }}
          terraform_wrapper: false
      - name: Terraform Plan
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          cp "envs/$ENVIRONMENT/$ENVIRONMENT.tfvars" terraform.auto.tfvars
          rm -rf .terraform
          terraform init -input=false -backend-config="envs/$ENVIRONMENT/$ENVIRONMENT.tfconfig"
          terraform plan -input=false -lock-timeout=5m

  dev:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: dev
    secrets: inherit
  acc:
    needs: dev
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: acc
    secrets: inherit
  prd:
    needs: acc
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: prd
    secrets: inherit
