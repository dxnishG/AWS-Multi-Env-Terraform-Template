name: Terraform CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote the checked revision through DEV, ACC and PRD
        type: boolean
        default: false
permissions:
  contents: read
# Serialize promotions across every ref; never cancel an active apply.
concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/terraform-quality.yml
  dev:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: dev
    secrets: inherit
  acc:
    needs: dev
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: acc
    secrets: inherit
  prd:
    needs: acc
    uses: ./.github/workflows/terraform-deploy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: prd
    secrets: inherit
